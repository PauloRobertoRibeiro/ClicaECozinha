<!DOCTYPE html>
<html lang="pt" translate="no" class="notranslate">
<head>
  <meta charset="utf-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Clica e Cozinha</title>
  <link rel="stylesheet" href="styles.css?v=7" />
  <link rel="icon" href="icon.svg" />
</head>
<body class="notranslate gated" translate="no">
  <div id="gate" class="gate" role="dialog" aria-modal="true" aria-labelledby="gateBrand">
    <div class="gate-glow" aria-hidden="true"></div>
    <button class="gate-lang" type="button" data-act="lang" id="gateLang">ES</button>
    <div class="gate-inner">
      <p class="gate-kicker" id="gateKicker">Culinária do mundo</p>
      <div class="scene" aria-hidden="true">
        <span class="steam s1"></span>
        <span class="steam s2"></span>
        <span class="steam s3"></span>
        <svg class="pan-svg" viewBox="0 0 220 160" fill="none">
          <ellipse cx="108" cy="128" rx="72" ry="10" fill="#2a0f07" opacity=".35"/>
          <path d="M42 78c6 32 28 48 66 48s60-16 66-48" fill="#5c220f"/>
          <ellipse cx="108" cy="78" rx="68" ry="22" fill="#9a3412"/>
          <ellipse cx="108" cy="74" rx="58" ry="16" fill="#c2410c"/>
          <ellipse cx="108" cy="70" rx="48" ry="11" fill="#fdba74" opacity=".55"/>
          <path d="M174 74c28 4 42 18 38 28-4 10-22 12-38 8" stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>
          <circle cx="214" cy="98" r="7" fill="#fde68a"/>
          <path d="M96 52c2-14 10-22 18-22" stroke="#fed7aa" stroke-width="3" stroke-linecap="round" opacity=".8"/>
        </svg>
      </div>
      <h1 class="gate-title">
        <span id="gateLine">Clica e</span>
        <strong id="gateBrand">Cozinha</strong>
      </h1>
      <p class="gate-lede" id="gateLede">Escolhe o país, a região e o prato. Ingredientes e passos estão aqui — sem YouTube.</p>
      <ul class="gate-flags" aria-hidden="true">
        <li><svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#009c3b"/><polygon points="15,2 28,10 15,18 2,10" fill="#ffdf00"/><circle cx="15" cy="10" r="4" fill="#002776"/></svg></li>
        <li><svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#c60b1e"/><rect y="5" width="30" height="10" fill="#ffc400"/></svg></li>
        <li><svg viewBox="0 0 30 20"><rect width="10" height="20" fill="#006847"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ce1126"/></svg></li>
        <li><svg viewBox="0 0 30 20"><rect width="10" height="20" fill="#009246"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ce2b37"/></svg></li>
        <li><svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="5.5" fill="#bc002d"/></svg></li>
        <li><svg viewBox="0 0 30 20"><rect width="10" height="20" fill="#d91023"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#d91023"/></svg></li>
      </ul>
      <button class="gate-cta" type="button" data-act="enter" id="gateEnter">Começar a cozinhar</button>
    </div>
    <p class="gate-foot" id="gateFoot">País · Região · Receita</p>
  </div>

  <div class="phone">
    <header class="top">
      <a class="brand-chip" href="#inicio">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M5 8h14M5 16h14" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
        <span id="brandChip">Clica e Cozinha · Mundo</span>
      </a>
      <div class="top-btns">
        <button class="icon-btn" type="button" data-act="focus-search" aria-label="Buscar">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn lang-btn" type="button" data-act="lang" id="langBtn">ES</button>
      </div>
    </header>
    <main id="view"></main>
    <nav class="tabs" id="tabs">
      <a href="#inicio" data-tab="inicio">
        <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z" fill="currentColor"/></svg>
        <span class="tab-label">Início</span>
      </a>
      <a href="#explorar" data-tab="explorar">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m14.8 9.2-1.3 5.3-5.3 1.3 1.3-5.3z" fill="currentColor"/></svg>
        <span class="tab-label">Explorar</span>
      </a>
      <a href="#lista" data-tab="lista">
        <svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 8h6M9 12h6M9 16h4" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        <span class="tab-label">Lista</span>
      </a>
      <a href="#perfil" data-tab="perfil">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 19c1.4-3.2 3.6-4.8 7-4.8s5.6 1.6 7 4.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="tab-label">Perfil</span>
      </a>
    </nav>
  </div>
  <script src="recipes.js?v=7"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
